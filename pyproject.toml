[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "TirganachReloaded"
version = "0.1.0"
description = "SpellForce CFF Editor and related tools"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "SpellSmut Team"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.9"
dependencies = [
    "PySide6>=6.0.0",
    "pillow>=10.0.0",   # For image processing
    "pyyaml>=6.0",      # For configuration files
    "pytest>=7.0.0",
]



[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
    "PyQt6>=6.0.0",
    "PyQt6-Qt6>=6.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["TirganachReloaded"]
source = "src"

[tool.hatch.envs.default]
dependencies = [
    "PySide6",
    "pillow",
    "pyyaml",
]

[tool.hatch.envs.dev]
dependencies = [
    "pytest",
    "black",
    "isort",
    "mypy",
]

[tool.black]
line-length = 88
target-version = ['py39']

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["src/tests"]
pythonpath = ["src"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
cache_dir = "src/tests/test_data/.pytest_cache"
addopts = [
    "--verbose",
    "--tb=short",
    "--basetemp=src/tests/test_data/tmp",
]
markers = [
    "gui: marks tests that require GUI (deselect with '-m \"not gui\"')",
    "integration: marks tests that require external resources",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.coverage.run]
source = ["src"]
data_file = "src/tests/test_data/.coverage"

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.coverage.html]
directory = "src/tests/test_data/htmlcov"
