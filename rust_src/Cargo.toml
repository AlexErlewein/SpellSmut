[package]
name = "spellsmut-tools"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.0", features = ["derive"] }
image = "0.25"
rayon = "1.10"
walkdir = "2.5"
regex = "1.10"

[[bin]]
name = "spellsmut-tools"
path = "src/main.rs"

[[bin]]
name = "icon-extractor"
path = "src/icon_extractor.rs"

[profile.release]
opt-level = 3
lto = true
